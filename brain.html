<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Second Brain · zentry</title>
<meta name="theme-color" content="#050506">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Second Brain">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#050506; --card:#0f0f12; --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.13);
  --text:#ededf0; --muted:#8a8a93; --dim:#5a5a62;
  --orange:#f08a3c; --green:#3ddc84; --blue:#3b82f6; --purple:#a855f7; --warm:#f2b27a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pill{height:30px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(16,16,19,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;color:#d8d8de;transition:.2s}
.pill:hover{background:rgba(34,34,40,.85);color:#fff}

#brand{position:fixed;top:calc(14px + env(safe-area-inset-top));left:16px;z-index:5;user-select:none}
#brand b{font-size:12px;font-weight:600;display:block}
#brand span{font-size:10.5px;color:var(--dim)}
#homeBtn{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5}
#pagesBtn{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:5}
#dock{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:2px;padding:4px 6px;border-radius:999px;border:1px solid var(--line);background:rgba(16,16,19,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#dock button{width:30px;height:26px;border-radius:999px;color:var(--muted);display:grid;place-items:center}
#dock button:hover{color:#fff;background:rgba(255,255,255,.06)}
#dock svg{width:13px;height:13px}

#hello{position:fixed;top:calc(64px + env(safe-area-inset-top));left:24px;width:290px;z-index:4;transition:opacity .4s}
#hello.hide{opacity:0;pointer-events:none}
#hello h1{font-size:23px;font-weight:600;letter-spacing:-.3px;cursor:default}
#hello .since{color:var(--dim);font-size:10.5px;margin:3px 0 14px}
#hello .note{color:#cfcfd6;line-height:1.55;font-size:13px;margin-bottom:20px}
.eyebrow{font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:500}
.up{display:flex;gap:12px;padding:4px 0;cursor:pointer;font-size:12px;line-height:1.4}
.up .d{color:var(--orange);min-width:58px;white-space:nowrap}
.up .d.late{color:#ff5d5d}
.up .t{color:#c8c8cf}
.up:hover .t{color:#fff}

#tip{position:fixed;z-index:8;pointer-events:none;padding:7px 10px;border-radius:8px;background:rgba(20,20,24,.92);border:1px solid var(--line2);font-size:11.5px;max-width:260px;opacity:0;transition:opacity .12s}
#tip .s{color:var(--muted);font-size:10.5px;margin-top:2px}

.sheet{background:rgba(13,13,16,.94);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .35s}
#scrim.open{opacity:1;pointer-events:auto}
#home{position:fixed;left:50%;top:50%;width:min(860px,calc(100% - 32px));height:min(780px,calc(100% - 96px));z-index:21;display:flex;flex-direction:column;
  transform:translate(-50%,-48%) scale(.97);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s}
#home.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.hd{display:flex;align-items:center;gap:10px;padding:18px 18px 12px}
.hd h2{font-size:19px;font-weight:600}
.chip{font-size:10.5px;color:var(--muted);padding:3px 8px;border-radius:999px;border:1px solid var(--line2)}
.x{margin-left:auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);color:var(--muted);font-size:11px;flex:none}
.x:hover{color:#fff}
.search{margin:0 18px 14px;display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.02)}
.search:focus-within{border-color:rgba(255,255,255,.3)}
.search input{flex:1;background:none;border:0;outline:0;font-size:13px;min-width:0}
.search input::placeholder{color:var(--dim)}
.search svg{width:13px;height:13px;color:var(--muted);flex:none}
.scroll{overflow:auto;padding:0 18px 18px;flex:1}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:8px}
.grid{display:grid;gap:10px}
.k4{grid-template-columns:repeat(4,1fr)}
.k3{grid-template-columns:repeat(3,1fr)}
.k2{grid-template-columns:repeat(2,1fr)}
.box{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;position:relative;overflow:hidden}
.kpi{min-height:92px;border-color:color-mix(in srgb,var(--c) 45%,transparent);background:linear-gradient(180deg,var(--card) 40%,color-mix(in srgb,var(--c) 7%,var(--card)))}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--c);opacity:.9}
.kpi .n{font-size:22px;font-weight:600;letter-spacing:-.4px}
.kpi .l{font-size:11.5px;color:#d0d0d6;margin-top:1px}
.kpi .s{font-size:10px;color:var(--dim)}
.kpi .b{position:absolute;top:12px;right:12px;font-size:9.5px;padding:2px 6px;border-radius:5px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.spark{position:absolute;right:12px;bottom:12px;display:flex;align-items:flex-end;gap:2px;height:22px}
.spark i{width:9px;background:var(--c);opacity:.35;border-radius:1.5px}
.spark i:last-child{opacity:1}
.box h3{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.box h3::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,#fff)}
.box .sub{font-size:10.5px;color:var(--dim);margin:2px 0 12px}
.chart{display:flex;align-items:flex-end;gap:2px;height:150px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding-left:4px;position:relative}
.chart i{flex:1;background:linear-gradient(180deg,#b27cff,#7c3aed);border-radius:2px 2px 0 0;min-height:0;opacity:.95}
.chart i.z{background:none}
.chart i:hover{filter:brightness(1.3)}
.ax{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim);margin-top:5px;padding-left:4px}
.yl{position:absolute;left:-22px;font-size:9px;color:var(--dim)}
.hb{padding:6px 0;cursor:pointer}
.hb .r{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px;color:#d8d8de;gap:8px}
.hb .r span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .r span:last-child{color:var(--muted)}
.hb .t{height:3px;border-radius:3px;background:rgba(255,255,255,.05)}
.hb .t i{display:block;height:100%;border-radius:3px;background:var(--c)}
.hb:hover .r span:first-child{color:#fff}
.li{padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border:0}
.li .a{font-size:12px;color:#e4e4e8}
.li .s{font-size:10.5px;color:var(--dim);margin-top:1px}
.li:hover .a{color:#fff}
.eyebrow.sm{font-size:9px;margin-bottom:4px}
.empty{color:var(--dim);padding:10px 0}
.res .li .a mark,.res .li .s mark{background:rgba(255,255,255,.16);color:#fff;border-radius:3px}

#side{position:fixed;top:calc(54px + env(safe-area-inset-top));right:14px;bottom:calc(56px + env(safe-area-inset-bottom));width:400px;z-index:10;display:flex;flex-direction:column;
  transform:translateX(calc(100% + 30px));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#side.open{transform:none}
#side .hd h2{font-size:16px;line-height:1.3}
#side .meta{font-size:10.5px;color:var(--dim);padding:0 18px 12px;margin-top:-6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grp{margin:14px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.grp b{font-size:11px;font-weight:600;letter-spacing:.3px}
.grp span{font-size:10px;color:var(--dim)}
.md{font-size:13px;line-height:1.65;color:#d6d6dc}
.md h1,.md h2,.md h3{color:#fff;font-weight:600;line-height:1.3;margin:20px 0 6px;scroll-margin-top:12px}
.md h2{font-size:14.5px}.md h3{font-size:13px}
.md h2.hl{animation:hl 2s}
@keyframes hl{0%{color:var(--warm)}100%{color:#fff}}
.md p{margin:6px 0}
.md ul{margin:6px 0 6px 18px}
.md li{margin:2px 0}
.md li.task{list-style:none;margin-left:-18px}
.md li.task input{margin-right:7px;accent-color:#a855f7;vertical-align:-1px}
.md li.task.done span{color:var(--dim);text-decoration:line-through}
.md code{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:11.5px;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px}
.md pre{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;margin:8px 0}
.md pre code{background:none;padding:0}
.md a{color:#fff;text-decoration:underline;text-decoration-color:rgba(255,255,255,.3);text-underline-offset:2px;cursor:pointer}
.md a.wl{text-decoration:none;border-bottom:1px dashed rgba(255,255,255,.35)}
.md a:hover{text-decoration-color:#fff;border-color:#fff}
.md .due{color:var(--orange);font-size:11.5px}
.md > :first-child{margin-top:0}
.back{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 14px}
.btn{height:28px;padding:0 11px;border-radius:8px;border:1px solid var(--line2);font-size:11.5px;color:#d8d8de;background:rgba(255,255,255,.02)}
.btn:hover{color:#fff;border-color:rgba(255,255,255,.28)}
textarea.edit{width:100%;min-height:55vh;background:rgba(255,255,255,.02);border:1px solid var(--line2);border-radius:10px;padding:12px;outline:0;resize:vertical;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6;color:#ddd}

#toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom));transform:translate(-50%,8px);opacity:0;z-index:40;padding:7px 13px;border-radius:999px;font-size:12px;background:rgba(20,20,24,.95);border:1px solid var(--line2);transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#install{display:none}

@media (max-width:860px){ .k4{grid-template-columns:repeat(2,1fr)} .k3,.k2{grid-template-columns:1fr} }
@media (max-width:700px){
  #hello{left:16px;right:16px;width:auto;top:calc(52px + env(safe-area-inset-top))}
  #hello h1{font-size:20px} #hello .note{display:none}
  #brand span{display:none}
  #home{width:100%;height:calc(100% - 40px - env(safe-area-inset-top));top:auto;bottom:0;left:0;transform:translateY(30px);border-radius:16px 16px 0 0}
  #home.open{transform:none}
  #side{left:8px;right:8px;width:auto;top:auto;height:70vh;bottom:8px;transform:translateY(calc(100% + 20px))}
  #side.open{transform:none}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="brand"><b id="appTitle">Second Brain</b><span id="sub">60 fps</span></div>
<button class="pill" id="homeBtn">Home</button>
<button class="pill" id="pagesBtn">Pages</button>

<section id="hello">
  <h1 id="greet" title="Click to set your name">Evening.</h1>
  <div class="since" id="since"></div>
  <p class="note" id="note"></p>
  <div class="eyebrow">Coming up</div>
  <div id="upcoming"></div>
</section>

<div id="dock">
  <button id="zout" title="Zoom out (−)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h10"/></svg></button>
  <button id="zin" title="Zoom in (+)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h10M8 3v10"/></svg></button>
  <button id="zreset" title="Reset view (0)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 8a4.5 4.5 0 1 0 1.4-3.3M3.5 2.5v2.6h2.6"/></svg></button>
  <button id="pause" title="Pause motion (Space)"></button>
  <button id="full" title="Fullscreen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3"/></svg></button>
  <button id="install" title="Install as app"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2.5v8M4.8 7.5 8 10.7l3.2-3.2M3 13.5h10"/></svg></button>
</div>

<div id="tip"></div>
<div id="scrim"></div>

<section id="home" class="sheet" role="dialog" aria-label="Home">
  <div class="hd"><h2>Home</h2><span class="chip" id="today"></span><button class="x" data-close-home>✕</button></div>
  <label class="search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input id="q" placeholder="Search every page and conversation…" autocomplete="off"></label>
  <div class="scroll" id="homeBody"></div>
</section>

<aside id="side" class="sheet"></aside>
<div id="toast"></div>

<script src="brain/brain-data.js"></script>
<script>
(() => {
'use strict';
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const DAY = 864e5;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const sod = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const fmtD = t => MON[new Date(t).getMonth()] + ' ' + new Date(t).getDate();
const fmtFull = t => { const d = new Date(t); return `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
const fmtDue = t => { const n = Math.round((sod(t) - sod(Date.now())) / DAY); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : n < 0 ? fmtD(t) : 'by ' + fmtD(t); };
function ago(t) {
  const m = (Date.now() - t) / 6e4;
  if (m < 2) return 'just now'; if (m < 60) return Math.round(m) + ' minutes ago';
  const h = m / 60; if (h < 36) return Math.round(h) + (Math.round(h) === 1 ? ' hour ago' : ' hours ago');
  const d = h / 24; return d < 14 ? Math.round(d) + ' days ago' : fmtD(t);
}
const store = {
  get(k, d) { try { const v = localStorage.getItem('zentry.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('zentry.' + k, JSON.stringify(v)); } catch (e) {} }
};
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = Math.imul(s ^ s >>> 15, 1 | s) + 0x6D2B79F5 >>> 0, ((s ^ s >>> 14) >>> 0) / 4294967296); }
const strHash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const gauss = r => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2832 * v); };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= data ================= */
const BRAIN = window.BRAIN || { pages: [], config: {} };
const cfg = BRAIN.config || {};
// parse a raw markdown page in the browser (local edits / imports) – mirrors tools/build-brain.mjs
function parsePage(raw, slug, path, fallbackGroup) {
  const m = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/); const meta = {};
  if (m) m[1].split(/\r?\n/).forEach(l => { const kv = l.match(/^([\w-]+):\s*(.*?)\s*(#.*)?$/); if (kv) meta[kv[1]] = /^\[.*\]$/.test(kv[2]) ? kv[2].slice(1, -1).split(',').map(s => s.trim()).filter(Boolean) : kv[2].replace(/^["']|["']$/g, ''); });
  const body = m ? raw.slice(m[0].length) : raw;
  const ideas = []; let cur = null, code = false;
  body.split(/\r?\n/).forEach(l => { if (/^```/.test(l)) code = !code; const h = !code && l.match(/^##\s+(.+)/); if (h) { cur = { title: h[1].trim(), text: '' }; ideas.push(cur); } else if (cur) cur.text += l + '\n'; });
  if (!ideas.length) ideas.push({ title: meta.title || slug, text: body });
  const ts = s => { const t = Date.parse(s); return isNaN(t) ? null : t; };
  const created = ts(meta.created) || Date.now();
  return {
    slug, path, title: meta.title || slug, group: meta.group || fallbackGroup || 'Inbox', tags: Array.isArray(meta.tags) ? meta.tags : [],
    created, updated: ts(meta.updated) || created, ideas: ideas.map(i => ({ title: i.title, text: i.text.trim() })),
    links: [...new Set([...body.matchAll(/\[\[([^\]|#]+)(?:[|#][^\]]*)?\]\]/g)].map(x => x[1].trim()))],
    tasks: [...body.matchAll(/^\s*[-*]\s+\[( |x|X)\]\s+(.+)$/gm)].map(x => { const d = x[2].match(/@(\d{4}-\d{2}-\d{2})/); return { done: x[1] !== ' ', text: x[2].replace(/@\d{4}-\d{2}-\d{2}/, '').replace(/\s*→.*$/, '').trim(), due: d ? ts(d[1] + 'T18:00:00') : null }; }),
    body: body.trim(), raw, local: true
  };
}
const overrides = store.get('overrides', {});   // slug -> raw md edited or imported in this browser
let pages = [];
function loadPages() {
  pages = BRAIN.pages.map(p => overrides[p.slug] ? Object.assign(parsePage(overrides[p.slug], p.slug, p.path, p.group), { edited: true, local: false }) : p);
  Object.entries(overrides).forEach(([slug, raw]) => { if (!pages.find(p => p.slug === slug)) pages.push(parsePage(raw, slug, 'local/' + slug + '.md', 'Inbox')); });
  const slugs = new Set(pages.map(p => p.slug));
  pages.forEach(p => p.links = p.links.filter(l => slugs.has(l) && l !== p.slug));
  pages.forEach(p => p.backlinks = pages.filter(q => q.links.includes(p.slug)).map(q => q.slug));
}
loadPages();
const bySlug = s => pages.find(p => p.slug === s);
const groupNames = () => [...new Set(pages.map(p => p.group))];
const lastVisit = store.get('lastVisit', null);
store.set('lastVisit', Date.now());

/* ================= world layout ================= */
let W, H, DPR, base;
let slow = 0, lowRes = false;   // drop to 1x pixels automatically on slow machines
const HOLE = 40;
const world = { ideas: [], groups: [], dust: [], disk: [], comets: [], links: [] };
const ORDER = ['Projects', 'Records', 'Reference', 'Decisions', 'Reviews', 'Ideas', 'Inbox'];
const ord = n => { const i = ORDER.indexOf(n); return i < 0 ? 99 : i; };
function buildWorld() {
  const now = Date.now();
  const names = groupNames().sort((a, b) => ord(a) - ord(b) || a.localeCompare(b));
  const n = Math.max(names.length, 5);
  world.groups = names.map((name, i) => {
    const r = rng(strHash(name));
    const ps = pages.filter(p => p.group === name);
    return { name, ang: (i / n) * Math.PI * 2 - Math.PI / 2 + (r() - .5) * .3, dist: 230 + r() * 70, pages: ps, ideas: ps.reduce((s, p) => s + p.ideas.length, 0), x: 0, y: 0 };
  });
  world.ideas = [];
  world.groups.forEach(g => {
    let sx = 0, sy = 0, k = 0;
    g.pages.forEach(p => {
      const r = rng(strHash(p.slug));
      const age = Math.max(0, now - p.updated) / DAY;
      const pr = g.dist + Math.min(1, age / 60) * 160 + gauss(r) * 34;
      const pa = g.ang + gauss(r) * .2;
      const px = Math.cos(pa) * pr, py = Math.sin(pa) * pr;
      p.ideas.forEach((idea, j) => {
        const rr = rng(strHash(p.slug + j));
        const d = j === 0 ? 0 : 10 + rr() * 26, a = rr() * 6.2832;

  $('#since').textContent = lastVisit ? 'Since you were last here · ' + ago(lastVisit) : 'First visit · welcome';
  const changed = lastVisit ? pages.filter(p => p.updated > lastVisit) : [];
  const recs = pages.filter(p => p.group === 'Records').sort((a, b) => b.updated - a.updated || b.slug.localeCompare(a.slug));
  $('#note').innerHTML = !lastVisit
    ? `Your second brain: ${pages.length} pages and ${pages.reduce((s, p) => s + p.ideas.length, 0)} ideas so far. Click the black hole for Home.`
    : changed.length
      ? `${changed.length} page${changed.length > 1 ? 's' : ''} changed while you were away${recs[0] && recs[0].updated > lastVisit ? ` – latest summary: <a style="color:#fff;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(255,255,255,.3)" data-slug="${esc(recs[0].slug)}">${esc(recs[0].title)}</a>` : ''}.`
      : 'Everything is where you left it; nothing new came in.';
  const tasks = pages.flatMap(p => p.tasks.filter(t => !t.done && t.due).map(t => ({ ...t, page: p }))).sort((a, b) => a.due - b.due).slice(0, W < 700 ? 2 : 5);

}

    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
    .replace(/\[\[([^\]|#]+)(?:\|([^\]]+))?\]\]/g, (m, s, l) => { const p = bySlug(s.trim()); return `<a class="wl" data-slug="${s.trim()}">${l || (p ? esc(p.title) : s)}</a>`; })
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/@(\d{4}-\d{2}-\d{2})/g, (m, d) => `<span class="due">${fmtDue(Date.parse(d + 'T18:00'))}</span>`);
}
function renderMd(src) {
  let out = '', para = [], list = false, code = null, h2 = 0;
  const flushP = () => { if (para.length) { out += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
  const flush = () => { flushP(); if (list) { out += '</ul>'; list = false; } };
  for (const line of src.split(/\r?\n/)) {
    if (code !== null) { if (/^```/.test(line)) { out += `<pre><code>${esc(code)}</code></pre>`; code = null; } else code += (code ? '\n' : '') + line; continue; }
    if (/^```/.test(line)) { flush(); code = ''; continue; }
    const h = line.match(/^(#{1,3})\s+(.+)/);
    if (h) { flush(); const lv = h[1].length; out += `<h${lv}${lv === 2 ? ` id="idea-${h2++}"` : ''}>${inline(h[2])}</h${lv}>`; continue; }
    const t = line.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)/), li = !t && line.match(/^\s*[-*]\s+(.*)/);
    if (t || li) { flushP(); if (!list) { out += '<ul>'; list = true; }
      out += t ? `<li class="task ${t[1] !== ' ' ? 'done' : ''}"><input type="checkbox" disabled ${t[1] !== ' ' ? 'checked' : ''}><span>${inline(t[2])}</span></li>` : `<li>${inline(li[1])}</li>`; continue; }
    if (!line.trim()) { flush(); continue; }
    if (list) { out += '</ul>'; list = false; }
    para.push(line.trim());
  }
  if (code !== null) out += `<pre><code>${esc(code)}</code></pre>`;
  flush(); return out;
}

/* ================= side panel ================= */
const side = $('#side');
function bindLinks(root) {
  root.querySelectorAll('[data-slug]').forEach(el => el.onclick = ev => { ev.preventDefault(); const p = bySlug(el.dataset.slug); if (p) { closeHome(true); openPage(p, +(el.dataset.idea || 0)); } });
  root.querySelectorAll('[data-group]').forEach(el => el.onclick = () => { const g = world.groups.find(x => x.name === el.dataset.group); if (g) { closeHome(true); openGroup(g); } });
  root.querySelectorAll('[data-close]').forEach(el => el.onclick = closeSide);
}
function showSide(html) { side.innerHTML = html; side.classList.add('open'); $('#hello').classList.add('hide'); bindLinks(side); }
function closeSide() { side.classList.remove('open'); focus = null; selIdea = null; if (!homeOpen) { $('#hello').classList.remove('hide'); flyHome(); } }
function rawOf(p) {
  if (overrides[p.slug]) return overrides[p.slug];
  if (p.raw) return p.raw;
  const d = t => new Date(t).toISOString().slice(0, 10);
  return `---\ntitle: ${p.title}\ngroup: ${p.group}\ncreated: ${d(p.created)}\nupdated: ${d(p.updated)}\n${p.tags.length ? `tags: [${p.tags.join(', ')}]\n` : ''}---\n${p.body}\n`;
}
function openPage(p, j = 0, editing = false) {
  if (!p) return;
  const o = store.get('opened', []).filter(s => s !== p.slug); o.unshift(p.slug); store.set('opened', o.slice(0, 12));
  focus = null;
  const ideaObj = world.ideas.find(x => x.page === p && x.j === j) || world.ideas.find(x => x.page === p);
  selIdea = ideaObj;
  const back = p.backlinks.map(bySlug).filter(Boolean);
  showSide(`
    <div class="hd"><h2>${esc(p.title)}</h2><button class="x" data-close>✕</button></div>
    <div class="meta"><span class="chip">${esc(p.group)}</span>Updated ${ago(p.updated)} · ${p.ideas.length} ideas · <span style="font-family:ui-monospace,Menlo,monospace">${esc(p.path)}</span>${p.edited ? ' · <span style="color:var(--orange)">edited in this browser</span>' : ''}</div>
    <div class="tools"><button class="btn" id="bEdit">${editing ? 'Preview' : 'Edit'}</button><button class="btn" id="bDl">Download .md</button>${p.edited || p.local ? `<button class="btn" id="bRevert">${p.local ? 'Delete local note' : 'Revert my edits'}</button>` : ''}</div>
    <div class="scroll">${editing ? `<textarea class="edit" id="ta" spellcheck="false"></textarea><div class="tools" style="padding:10px 0 0"><button class="btn" id="bSave" style="border-color:#fff;color:#fff">Save</button></div>` : `<div class="md">${renderMd(p.body)}</div>`}
    ${back.length && !editing ? `<div class="back"><div class="eyebrow">Linked from</div>${back.map(b => `<div class="li" data-slug="${esc(b.slug)}"><div class="a">${esc(b.title)}</div><div class="s">${esc(b.group)}</div></div>`).join('')}</div>` : ''}</div>`);
  if (editing) { $('#ta').value = rawOf(p); $('#ta').focus(); $('#bSave').onclick = () => { overrides[p.slug] = $('#ta').value; store.set('overrides', overrides); reload(p.slug); toast('Saved in this browser · Download .md to keep it in the repo'); }; }
  else { const h = side.querySelector('#idea-' + j); if (h && j > 0) { h.scrollIntoView({ block: 'start' }); h.classList.add('hl'); } }
  $('#bEdit').onclick = () => openPage(p, j, !editing);
  $('#bDl').onclick = () => download(p.slug + '.md', rawOf(p));
  if ($('#bRevert')) $('#bRevert').onclick = () => { delete overrides[p.slug]; store.set('overrides', overrides); reload(p.slug); toast(p.local ? 'Deleted' : 'Reverted to the repo version'); };
  if (ideaObj) flyTo(ideaObj.x, ideaObj.y, j > 0 ? 3.4 : 2.5);
}
function reload(slug) { loadPages(); buildWorld(); renderHello(); const p = bySlug(slug); if (p) openPage(p); else closeSide(); }
function openGroup(g) {
  selIdea = null; focus = g;
  const ps = [...g.pages].sort((a, b) => b.updated - a.updated);
  showSide(`
    <div class="hd"><h2>${esc(g.name)}</h2><button class="x" data-close>✕</button></div>
    <div class="meta">${ps.length} pages · ${g.ideas} ideas · last update ${ago(ps[0].updated)}</div>
    <div class="scroll">${ps.map(p => `<div class="li" data-slug="${esc(p.slug)}"><div class="a">${esc(p.title)}</div><div class="s">${p.ideas.slice(0, 4).map(i => esc(i.title)).join(' · ')}${p.ideas.length > 4 ? ' …' : ''}</div></div>`).join('')}</div>`);
  flyTo(g.x, g.y, 1.9);
}
function openPages() {
  focus = null; selIdea = null;
  const gs = world.groups.map(g => `<div class="grp"><b>${esc(g.name)}</b><span>${g.pages.length}</span></div>` + [...g.pages].sort((a, b) => b.updated - a.updated).map(p => `<div class="li" data-slug="${esc(p.slug)}"><div class="a">${esc(p.title)}</div><div class="s">${p.ideas.length} ideas · ${ago(p.updated)}</div></div>`).join('')).join('');
  showSide(`<div class="hd"><h2>Pages</h2><span class="chip">${pages.length}</span><button class="x" data-close>✕</button></div>
    <div class="tools"><button class="btn" id="bNew">+ New note</button><button class="btn" id="bImport">Import .md</button></div>
    <div class="scroll" style="padding-top:0">${gs}</div>`);
  $('#bNew').onclick = newNote; $('#bImport').onclick = importMd;
  flyHome();
}
function newNote() {
  const title = prompt('Title of the new note'); if (!title) return;
  const slug = 'local-' + (title.toLowerCase().replace(/[^\p{L}\d]+/gu, '-').replace(/^-|-$/g, '') || 'note') + '-' + Date.now().toString(36).slice(-4);
  const d = new Date().toISOString().slice(0, 10);
  overrides[slug] = `---\ntitle: ${title}\ngroup: Inbox\ncreated: ${d}\nupdated: ${d}\n---\n## ${title}\n\n`;
  store.set('overrides', overrides); loadPages(); buildWorld(); openPage(bySlug(slug), 0, true);
}
function importMd() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.md,.markdown,.txt,text/markdown,text/plain'; inp.multiple = true;
  inp.onchange = async () => {
    for (const f of inp.files) overrides[f.name.replace(/\.(md|markdown|txt)$/i, '')] = await f.text();
    store.set('overrides', overrides); loadPages(); buildWorld(); renderHello(); openPages(); toast(`Imported ${inp.files.length} file${inp.files.length > 1 ? 's' : ''}`);
  };
  inp.click();
}
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/markdown' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

/* ================= home dashboard ================= */
function openHome() {
  if (homeOpen) return; homeOpen = true;
  side.classList.remove('open'); focus = null; selIdea = null;
  cam.tx = 0; cam.ty = 0; cam.tz = 5.5;                       // dive into the black hole
  $('#hello').classList.add('hide');
  setTimeout(() => { if (!homeOpen) return; renderHome(); $('#home').classList.add('open'); $('#scrim').classList.add('open'); }, reduced ? 0 : 380);
}
function closeHome(keepCam) {
  if (!homeOpen) return; homeOpen = false;
  $('#home').classList.remove('open'); $('#scrim').classList.remove('open'); $('#q').value = '';
  if (keepCam !== true) { flyHome(); $('#hello').classList.remove('hide'); }
}
const spark = vals => { const m = Math.max(1, ...vals); return `<div class="spark">${vals.map(v => `<i style="height:${Math.max(2, v / m * 22)}px"></i>`).join('')}</div>`; };
const WEEKS = [7, 6, 5, 4, 3, 2, 1, 0];
function renderHome(q = '') {
  const now = Date.now();
  $('#today').textContent = fmtFull(now);
  if (q.trim()) return renderSearch(q);
  const ideas = pages.reduce((s, p) => s + p.ideas.length, 0), links = pages.reduce((s, p) => s + p.links.length, 0);
  const wk = pages.filter(p => p.updated > now - 7 * DAY).length, newWk = pages.filter(p => p.created > now - 7 * DAY).length;
  const upTo = w => pages.filter(p => p.created <= now - w * 7 * DAY);
  const perDay = Array.from({ length: 30 }, (_, i) => { const d0 = sod(now) - (29 - i) * DAY; return pages.filter(p => p.updated >= d0 && p.updated < d0 + DAY).length; });
  const mx = Math.max(1, ...perDay);
  const gs = world.groups.map(g => ({ g, n: g.ideas })).sort((a, b) => b.n - a.n), gmax = Math.max(1, ...gs.map(x => x.n));
  const conn = pages.map(p => ({ p, n: p.links.length + p.backlinks.length })).sort((a, b) => b.n - a.n).slice(0, 6), cmax = Math.max(1, ...conn.map(x => x.n));
  const opened = store.get('opened', []).map(bySlug).filter(Boolean);
  const recent = (opened.length ? opened : [...pages].sort((a, b) => b.updated - a.updated)).slice(0, 4);
  const recs = pages.filter(p => p.group === 'Records').sort((a, b) => b.updated - a.updated || b.slug.localeCompare(a.slug)).slice(0, 4);
  const per = n => (n / Math.max(1, pages.length)).toFixed(1);
  $('#homeBody').innerHTML = `
  <div class="grid k4">
    <div class="box kpi" style="--c:var(--orange)"><div class="n">${pages.length}</div><div class="l">Pages</div><div class="s">in ${world.groups.length} groups</div><span class="b">+${newWk} new</span>${spark(WEEKS.map(w => upTo(w).length))}</div>
    <div class="box kpi" style="--c:var(--green)"><div class="n">${ideas}</div><div class="l">Ideas</div><div class="s">sections across all pages</div><span class="b">${per(ideas)} / page</span>${spark(WEEKS.map(w => upTo(w).reduce((s, p) => s + p.ideas.length, 0)))}</div>
    <div class="box kpi" style="--c:var(--blue)"><div class="n">${links}</div><div class="l">Links</div><div class="s">between pages</div><span class="b">${per(links)} / page</span>${spark(WEEKS.map(w => upTo(w).reduce((s, p) => s + p.links.length, 0)))}</div>
    <div class="box kpi" style="--c:var(--purple)"><div class="n">${wk}</div><div class="l">Updated this week</div><div class="s">pages changed in 7 days</div><span class="b">${Math.round(wk / Math.max(1, pages.length) * 100)}%</span>${spark(WEEKS.map(w => pages.filter(p => p.updated > now - (w + 1) * 7 * DAY && p.updated <= now - w * 7 * DAY).length))}</div>
  </div>
  <div class="grid k3" style="margin-top:10px">
    <div class="box" style="--c:var(--purple)"><h3>Pages updated</h3><div class="sub">Per day, last 30 days</div>
      <div style="padding-left:20px"><div class="chart"><span class="yl" style="top:-4px">${mx}</span><span class="yl" style="top:46%">${Math.round(mx / 2)}</span><span class="yl" style="bottom:-4px">0</span>${perDay.map((v, i) => `<i class="${v ? '' : 'z'}" style="height:${v / mx * 100}%" title="${fmtD(sod(now) - (29 - i) * DAY)}: ${v}"></i>`).join('')}</div>
      <div class="ax"><span>${fmtD(now - 29 * DAY)}</span><span>${fmtD(now - 15 * DAY)}</span><span>${fmtD(now)}</span></div></div></div>
    <div class="box" style="--c:var(--green)"><h3>Ideas by group</h3><div class="sub">Sections per group · click to fly there</div>
      ${gs.map(x => `<div class="hb" data-group="${esc(x.g.name)}" style="--c:var(--green)"><div class="r"><span>${esc(x.g.name)}</span><span>${x.n}</span></div><div class="t"><i style="width:${x.n / gmax * 100}%"></i></div></div>`).join('')}</div>
    <div class="box" style="--c:var(--blue)"><h3>Most connected pages</h3><div class="sub">Links to other pages · click to open</div>
      ${conn.map(x => `<div class="hb" data-slug="${esc(x.p.slug)}" style="--c:var(--blue)"><div class="r"><span>${esc(x.p.title)}</span><span>${x.n}</span></div><div class="t"><i style="width:${x.n / cmax * 100}%"></i></div></div>`).join('')}</div>
  </div>
  <div class="grid k2" style="margin-top:10px">
    <div class="box"><div class="eyebrow sm">Recent activity</div>${recent.map(p => `<div class="li" data-slug="${esc(p.slug)}"><div class="a">${esc(p.title)}</div><div class="s">${opened.length ? 'Opened' : 'Updated'} · ${esc(p.group)}</div></div>`).join('')}</div>
    <div class="box"><div class="eyebrow sm">Newest conversation summaries</div>${recs.length ? recs.map(p => `<div class="li" data-slug="${esc(p.slug)}"><div class="a">Record: ${esc(p.title)}</div><div class="s">Summary created ${new Date(p.created).toISOString().slice(0, 10)}</div></div>`).join('') : '<div class="empty">No summaries yet.</div>'}</div>
  </div>`;
  bindLinks($('#homeBody'));
}
function renderSearch(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean), hits = [];
  pages.forEach(p => p.ideas.forEach((i, j) => {
    const hay = (p.title + ' ' + i.title + ' ' + i.text).toLowerCase();
    if (words.every(w => hay.includes(w))) hits.push({ p, i, j, score: words.filter(w => (p.title + ' ' + i.title).toLowerCase().includes(w)).length });
  }));
  hits.sort((a, b) => b.score - a.score || b.p.updated - a.p.updated);
  const mark = s => { let h = esc(s); words.forEach(w => h = h.replace(new RegExp('(' + esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>')); return h; };
  const snip = t => { const l = t.toLowerCase(), at = l.indexOf(words[0]), k = Math.max(0, at - 40); return (k ? '…' : '') + t.slice(k, k + 140).replace(/\s+/g, ' '); };
  $('#homeBody').innerHTML = `<div class="box res"><div class="eyebrow sm">${hits.length} result${hits.length === 1 ? '' : 's'}</div>${hits.slice(0, 50).map(h => `<div class="li" data-slug="${esc(h.p.slug)}" data-idea="${h.j}"><div class="a">${mark(h.p.title)}${h.p.ideas.length > 1 ? ' <span style="color:var(--dim)">›</span> ' + mark(h.i.title) : ''}</div><div class="s">${esc(h.p.group)} · ${mark(snip(h.i.text))}</div></div>`).join('') || '<div class="empty">Nothing found.</div>'}</div>`;
  bindLinks($('#homeBody'));
}
$('#q').addEventListener('input', e => renderHome(e.target.value));
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { const f = $('#homeBody [data-slug]'); if (f) f.click(); } });
document.querySelectorAll('[data-close-home]').forEach(b => b.onclick = () => closeHome());
$('#scrim').onclick = () => closeHome();

/* ================= chrome ================= */
$('#homeBtn').onclick = () => homeOpen ? closeHome() : openHome();
$('#pagesBtn').onclick = () => { closeHome(true); side.classList.contains('open') && !focus && !selIdea ? closeSide() : openPages(); };
$('#zin').onclick = () => cam.tz = clampZ(cam.tz * 1.35);
$('#zout').onclick = () => cam.tz = clampZ(cam.tz / 1.35);
$('#zreset').onclick = () => { closeHome(); closeSide(); };
const setPaused = v => { paused = v; $('#pause').innerHTML = v ? '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.5v9l7.5-4.5z"/></svg>' : '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="4.5" y="3.5" width="2.2" height="9" rx=".6"/><rect x="9.3" y="3.5" width="2.2" height="9" rx=".6"/></svg>'; };
setPaused(paused);
$('#pause').onclick = () => setPaused(!paused);
$('#full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
if (cfg.title) $('#appTitle').textContent = cfg.title;
addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openHome(); setTimeout(() => $('#q').focus(), reduced ? 0 : 420); return; }
  if (e.key === 'Escape') { if (typing) document.activeElement.blur(); if (homeOpen) closeHome(); else closeSide(); return; }
  if (typing) return;
  if (e.key === ' ') { e.preventDefault(); setPaused(!paused); }
  else if (e.key.toLowerCase() === 'h') homeOpen ? closeHome() : openHome();
  else if (e.key.toLowerCase() === 'p') $('#pagesBtn').click();
  else if (e.key === '0') $('#zreset').click();
  else if (e.key === '+' || e.key === '=') $('#zin').click();
  else if (e.key === '-') $('#zout').click();
});
let tT; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('show'), 2600); }

renderHello();

/* ================= app (PWA) ================= */
let deferred = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('#install').style.display = 'grid'; });
$('#install').onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $('#install').style.display = 'none'; };
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
if (location.hash.length > 1) { const p = bySlug(decodeURIComponent(location.hash.slice(1))); if (p) setTimeout(() => openPage(p), 300); }
})();
</script>
