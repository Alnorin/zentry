<title>Second Brain</title>
<meta name="description" content="Zentry Second Brain – galaxy of notes, inbox and Ask Claude">
<style>
:root{
  color-scheme:dark;
  --bg:#050506; --card:#0f0f12; --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.13);
  --text:#ededf0; --muted:#8a8a93; --dim:#5a5a62;
  --orange:#f08a3c; --green:#3ddc84; --blue:#3b82f6; --purple:#a855f7; --warm:#f2b27a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pill{height:30px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(16,16,19,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;color:#d8d8de;transition:.2s}
.pill:hover{background:rgba(34,34,40,.85);color:#fff}

#brand{position:fixed;top:calc(14px + env(safe-area-inset-top));left:16px;z-index:5;user-select:none}
#brand b{font-size:12px;font-weight:600;display:block}
#brand span{font-size:10.5px;color:var(--dim)}
#homeBtn{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5}
#pagesBtn{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:5}
#dock{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:2px;padding:4px 6px;border-radius:999px;border:1px solid var(--line);background:rgba(16,16,19,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#dock button{width:30px;height:26px;border-radius:999px;color:var(--muted);display:grid;place-items:center}
#dock button:hover{color:#fff;background:rgba(255,255,255,.06)}
#dock svg{width:13px;height:13px}

#hello{position:fixed;top:calc(64px + env(safe-area-inset-top));left:24px;width:290px;z-index:4;transition:opacity .4s}
#hello.hide{opacity:0;pointer-events:none}
#hello h1{font-size:23px;font-weight:600;letter-spacing:-.3px;cursor:default}
#hello .since{color:var(--dim);font-size:10.5px;margin:3px 0 14px}
#hello .note{color:#cfcfd6;line-height:1.55;font-size:13px;margin-bottom:20px}
.eyebrow{font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:500}
.up{display:flex;gap:12px;padding:4px 0;cursor:pointer;font-size:12px;line-height:1.4}
.up .d{color:var(--orange);min-width:58px;white-space:nowrap}
.up .d.late{color:#ff5d5d}
.up .t{color:#c8c8cf}
.up:hover .t{color:#fff}

#tip{position:fixed;z-index:8;pointer-events:none;padding:7px 10px;border-radius:8px;background:rgba(20,20,24,.92);border:1px solid var(--line2);font-size:11.5px;max-width:260px;opacity:0;transition:opacity .12s}
#tip .s{color:var(--muted);font-size:10.5px;margin-top:2px}

.sheet{background:rgba(13,13,16,.94);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .35s}
#scrim.open{opacity:1;pointer-events:auto}
#home{position:fixed;left:50%;top:50%;width:min(860px,calc(100% - 32px));height:min(780px,calc(100% - 96px));z-index:21;display:flex;flex-direction:column;
  transform:translate(-50%,-48%) scale(.97);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s}
#home.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.hd{display:flex;align-items:center;gap:10px;padding:18px 18px 12px}
.hd h2{font-size:19px;font-weight:600}
.chip{font-size:10.5px;color:var(--muted);padding:3px 8px;border-radius:999px;border:1px solid var(--line2)}
.x{margin-left:auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);color:var(--muted);font-size:11px;flex:none}
.x:hover{color:#fff}
.search{margin:0 18px 14px;display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.02)}
.search:focus-within{border-color:rgba(255,255,255,.3)}
.search input{flex:1;background:none;border:0;outline:0;font-size:13px;min-width:0}
.search input::placeholder{color:var(--dim)}
.search svg{width:13px;height:13px;color:var(--muted);flex:none}
.scroll{overflow:auto;padding:0 18px 18px;flex:1}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:8px}
.grid{display:grid;gap:10px}
.k4{grid-template-columns:repeat(4,1fr)}
.k3{grid-template-columns:repeat(3,1fr)}
.k2{grid-template-columns:repeat(2,1fr)}
.box{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;position:relative;overflow:hidden}
.kpi{min-height:92px;border-color:color-mix(in srgb,var(--c) 45%,transparent);background:linear-gradient(180deg,var(--card) 40%,color-mix(in srgb,var(--c) 7%,var(--card)))}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--c);opacity:.9}
.kpi .n{font-size:22px;font-weight:600;letter-spacing:-.4px}
.kpi .l{font-size:11.5px;color:#d0d0d6;margin-top:1px}
.kpi .s{font-size:10px;color:var(--dim)}
.kpi .b{position:absolute;top:12px;right:12px;font-size:9.5px;padding:2px 6px;border-radius:5px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.spark{position:absolute;right:12px;bottom:12px;display:flex;align-items:flex-end;gap:2px;height:22px}
.spark i{width:9px;background:var(--c);opacity:.35;border-radius:1.5px}
.spark i:last-child{opacity:1}
.box h3{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.box h3::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,#fff)}
.box .sub{font-size:10.5px;color:var(--dim);margin:2px 0 12px}
.chart{display:flex;align-items:flex-end;gap:2px;height:150px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding-left:4px;position:relative}
.chart i{flex:1;background:linear-gradient(180deg,#b27cff,#7c3aed);border-radius:2px 2px 0 0;min-height:0;opacity:.95}
.chart i.z{background:none}
.chart i:hover{filter:brightness(1.3)}
.ax{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim);margin-top:5px;padding-left:4px}
.yl{position:absolute;left:-22px;font-size:9px;color:var(--dim)}
.hb{padding:6px 0;cursor:pointer}
.hb .r{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px;color:#d8d8de;gap:8px}
.hb .r span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .r span:last-child{color:var(--muted)}
.hb .t{height:3px;border-radius:3px;background:rgba(255,255,255,.05)}
.hb .t i{display:block;height:100%;border-radius:3px;background:var(--c)}
.hb:hover .r span:first-child{color:#fff}
.li{padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border:0}
.li .a{font-size:12px;color:#e4e4e8}
.li .s{font-size:10.5px;color:var(--dim);margin-top:1px}
.li:hover .a{color:#fff}
.eyebrow.sm{font-size:9px;margin-bottom:4px}
.empty{color:var(--dim);padding:10px 0}
.res .li .a mark,.res .li .s mark{background:rgba(255,255,255,.16);color:#fff;border-radius:3px}

#side{position:fixed;top:calc(54px + env(safe-area-inset-top));right:14px;bottom:calc(56px + env(safe-area-inset-bottom));width:400px;z-index:10;display:flex;flex-direction:column;
  transform:translateX(calc(100% + 30px));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#side.open{transform:none}
#side .hd h2{font-size:16px;line-height:1.3}
#side .meta{font-size:10.5px;color:var(--dim);padding:0 18px 12px;margin-top:-6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grp{margin:14px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.grp b{font-size:11px;font-weight:600;letter-spacing:.3px}
.grp span{font-size:10px;color:var(--dim)}
.md{font-size:13px;line-height:1.65;color:#d6d6dc}
.md h1,.md h2,.md h3{color:#fff;font-weight:600;line-height:1.3;margin:20px 0 6px;scroll-margin-top:12px}
.md h2{font-size:14.5px}.md h3{font-size:13px}
.md h2.hl{animation:hl 2s}
@keyframes hl{0%{color:var(--warm)}100%{color:#fff}}
.md p{margin:6px 0}
.md ul{margin:6px 0 6px 18px}
.md li{margin:2px 0}
.md li.task{list-style:none;margin-left:-18px}
.md li.task input{margin-right:7px;accent-color:#a855f7;vertical-align:-1px}
.md li.task.done span{color:var(--dim);text-decoration:line-through}
.md code{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:11.5px;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px}
.md pre{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;margin:8px 0}
.md pre code{background:none;padding:0}
.md a{color:#fff;text-decoration:underline;text-decoration-color:rgba(255,255,255,.3);text-underline-offset:2px;cursor:pointer}
.md a.wl{text-decoration:none;border-bottom:1px dashed rgba(255,255,255,.35)}
.md a:hover{text-decoration-color:#fff;border-color:#fff}
.md .due{color:var(--orange);font-size:11.5px}
.md > :first-child{margin-top:0}
.back{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 14px}
.btn{height:28px;padding:0 11px;border-radius:8px;border:1px solid var(--line2);font-size:11.5px;color:#d8d8de;background:rgba(255,255,255,.02)}
.btn:hover{color:#fff;border-color:rgba(255,255,255,.28)}
textarea.edit{width:100%;min-height:55vh;background:rgba(255,255,255,.02);border:1px solid var(--line2);border-radius:10px;padding:12px;outline:0;resize:vertical;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6;color:#ddd}

#toast{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top));transform:translate(-50%,-8px);opacity:0;z-index:40;padding:7px 13px;border-radius:999px;font-size:12px;background:rgba(20,20,24,.95);border:1px solid var(--line2);transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#install{display:none}
#dock .plus{width:34px;background:#fff;color:#050506}
#dock .plus:hover{background:#e9e9ee;color:#050506}
#dock .sep{width:1px;background:var(--line2);margin:5px 3px}
#dock button.on{color:#fff;background:rgba(255,255,255,.1)}
#time{position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;width:min(540px,calc(100% - 32px));display:none;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(16,16,19,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#time.open{display:flex}
#time input{flex:1;min-width:0;accent-color:#f2b27a}
#time .lbl{font-size:11px;color:#d8d8de;min-width:112px;text-align:right;font-variant-numeric:tabular-nums}
#capSheet{position:fixed;left:50%;top:42%;width:min(520px,calc(100% - 24px));z-index:31;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s;display:flex;flex-direction:column}
#capSheet.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
#capSheet .body{padding:0 18px 18px;display:grid;gap:12px}
.ta{position:relative}
.ta textarea{width:100%;min-height:110px;resize:none;background:rgba(255,255,255,.025);border:1px solid var(--line2);border-radius:12px;padding:12px 48px 12px 14px;outline:0;font-size:15px;line-height:1.5}
.ta textarea:focus{border-color:rgba(255,255,255,.32)}
.ta textarea::placeholder{color:var(--dim)}
.mic{position:absolute;right:10px;bottom:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--muted);background:rgba(16,16,19,.9)}
.mic svg{width:14px;height:14px}
.mic.live{border-color:#ff5d5d;color:#ff5d5d;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,93,93,.15)}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);font-size:12px;color:var(--muted)}
.chips button.on{color:#050506;background:#fff;border-color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row label{font-size:11.5px;color:var(--muted)}
input[type=date]{height:30px;background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:8px;padding:0 8px;color-scheme:dark;font-size:12px}
.btn.primary{background:#fff;color:#050506;border-color:#fff;font-weight:600;height:32px;padding:0 16px}
.btn.primary:hover{background:#e9e9ee;color:#050506}
.btn.primary:disabled{opacity:.4;cursor:default}
.hint{font-size:11px;color:var(--dim);line-height:1.5}
.askbtn{height:26px;padding:0 10px;border-radius:7px;background:#fff;color:#050506;font-size:11.5px;font-weight:600;flex:none}
.prompts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.prompts button{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);font-size:11.5px;color:#d8d8de;background:rgba(255,255,255,.02)}
.prompts button:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.answer{border:1px solid rgba(242,178,122,.28);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:linear-gradient(180deg,rgba(242,178,122,.07),rgba(242,178,122,0) 70%),var(--card)}
.answer .q{font-size:11px;color:var(--warm);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.answer .q span{flex:1}
.answer .md{font-size:13px}
.answer .think{color:var(--muted);font-size:12px}
.name-in{font-size:22px;font-weight:600;background:none;border:0;border-bottom:1px solid var(--line2);outline:0;width:100%;padding:2px 0}
.cap-item .a{display:flex;gap:8px;align-items:baseline}
.cap-item .a span:first-child{flex:1;min-width:0}
.badge{font-size:9.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.md li.task input{cursor:pointer}

@media (max-width:860px){ .k4{grid-template-columns:repeat(2,1fr)} .k3,.k2{grid-template-columns:1fr} }
@media (max-width:700px){
  #hello{left:16px;right:16px;width:auto;top:calc(52px + env(safe-area-inset-top))}
  #hello h1{font-size:20px} #hello .note{display:none}
  #brand span{display:none}
  #home{width:100%;height:calc(100% - 54px - env(safe-area-inset-top));top:auto;bottom:0;left:0;transform:translateY(30px);border-radius:16px 16px 0 0}
  #home.open{transform:none}
  #side{left:8px;right:8px;width:auto;top:auto;height:70vh;bottom:8px;transform:translateY(calc(100% + 20px))}
  #side.open{transform:none}
  #capSheet{top:auto;bottom:0;left:0;width:100%;transform:translateY(40px);border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  #capSheet.open{transform:none}
  #dock #full{display:none}
  #dock button{width:36px;height:30px}
  #dock .plus{width:42px}
}
</style>
<canvas id="sky"></canvas>

<div id="brand"><b id="appTitle">Second Brain</b><span id="sub">60 fps</span></div>
<button class="pill" id="homeBtn">Home</button>
<button class="pill" id="pagesBtn">Pages</button>

<section id="hello">
  <h1 id="greet" title="Click to set your name">Evening.</h1>
  <div class="since" id="since"></div>
  <p class="note" id="note"></p>
  <div class="eyebrow">Coming up</div>
  <div id="upcoming"></div>
</section>

<div id="dock">
  <button id="addBtn" class="plus" title="Log something (N)" aria-label="Log something"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v10M3 8h10"/></svg></button>
  <span class="sep"></span>
  <button id="zout" title="Zoom out (−)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h10"/></svg></button>
  <button id="zin" title="Zoom in (+)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h10M8 3v10"/></svg></button>
  <button id="zreset" title="Reset view (0)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 8a4.5 4.5 0 1 0 1.4-3.3M3.5 2.5v2.6h2.6"/></svg></button>
  <button id="pause" title="Pause motion (Space)"></button>
  <button id="timeBtn" title="Time travel (T)" aria-label="Time travel"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2 1.3"/></svg></button>
  <button id="full" title="Fullscreen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3"/></svg></button>
</div>

<div id="time" role="group" aria-label="Time travel">
  <button class="btn" id="ttPlay" style="height:26px">Replay</button>
  <input type="range" id="ttRange" min="0" max="1000" value="1000" aria-label="Show the brain as it was on">
  <span class="lbl" id="ttLbl"></span>
</div>
<section id="capSheet" class="sheet" role="dialog" aria-label="Log something">
  <div class="hd"><h2>Log it</h2><span class="chip" id="capWhere">Inbox</span><button class="x" id="capClose">✕</button></div>
  <div class="body">
    <div class="ta"><textarea id="capText" placeholder="What did you just do, decide or think of?"></textarea>
      <button class="mic" id="micBtn" hidden title="Dictate" aria-label="Dictate"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5.5" y="2" width="5" height="8" rx="2.5"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2"/></svg></button></div>
    <div class="chips" id="capGroups"></div>
    <div class="row"><label for="capDue">Deadline</label><input type="date" id="capDue"><span style="flex:1"></span><button class="btn primary" id="capSave" disabled>Save</button></div>
    <div class="hint" id="capHint"></div>
  </div>
</section>
<div id="tip"></div>
<div id="scrim"></div>

<section id="home" class="sheet" role="dialog" aria-label="Home">
  <div class="hd"><h2>Home</h2><span class="chip" id="today"></span><button class="x" data-close-home>✕</button></div>
  <label class="search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input id="q" placeholder="Search every page and conversation…" autocomplete="off"><button class="askbtn" id="askBtn" hidden>Ask Claude</button></label>
  <div class="scroll"><div id="askOut"></div><div id="homeBody"></div></div>
</section>

<aside id="side" class="sheet"></aside>
<div id="toast"></div>

<script>
/* generated by tools/build-brain.mjs – do not edit */

ive as `.md` files in `brain/`. The app never owns the data – it only reads a compiled bundle (`brain/brain-data.js`)."},{"title":"Why","text":"- Claude can write, update and rewrite notes with normal file edits and commit them.\n- Readable on GitHub, diffable, portable to Obsidian or any editor.\n- Nothing is locked in a browser's localStorage (the problem with v1, see [[first-prototype-review]])."},{"title":"How","text":"Format rules: [[markdown-format]]. After editing run `node tools/build-brain.mjs`; the Pages workflow also runs it on deploy."}],"links":["first-prototype-review","markdown-format"],"tasks":[],"body":"## Decision\nNotes live as `.md` files in `brain/`. The app never owns the data – it only reads a compiled bundle (`brain/brain-data.js`).\n\n## Why\n- Claude can write, update and rewrite notes with normal file edits and commit them.\n- Readable on GitHub, diffable, portable to Obsidian or any editor.\n- Nothing is locked in a browser's localStorage (the problem with v1, see [[first-prototype-review]]).\n\n## How\nFormat rules: [[markdown-format]]. After editing run `node tools/build-brain.mjs`; the Pages workflow also runs it on deploy."},{"slug":"phone-artifact","path":"brain/Decisions/phone-artifact.md","title":"Phone version as a claude.ai artifact","group":"Decisions","tags":["second-brain","mobile"],"created":1795219200000,"updated":1795219200000,"ideas":[{"title":"Decision","text":"Publish the same Second Brain as a private claude.ai artifact for the phone, next to the GitHub Pages PWA."},{"title":"Why","text":"- The artifact can keep data Claude can read: notes logged on the phone go to its database, and the next session files them into `brain/` as Markdown.\n- It can ask Claude directly (*Ask Claude*) and use dictation – things a static site cannot do without a backend.\n- One codebase: `tools/build-artifact.mjs` turns `brain.html` + the notes into `artifact/second-brain.html`."},{"title":"Limits","text":"- Notes in the artifact are a snapshot: after Claude changes `brain/`, the artifact must be republished.\n- No offline mode or install there; that is what the PWA is for ([[pwa-instead-of-electron]])."},{"title":"Workflow","text":"Each session: read the artifact's `captures` and `edits` collections, file new captures into the right pages, mark them `status: filed`, rebuild and republish. Details in `CLAUDE.md`. Related: [[second-brain-app]]."}],"links":["pwa-instead-of-electron","second-brain-app"],"tasks":[],"body":"## Decision\nPublish the same Second Brain as a private claude.ai artifact for the phone, next to the GitHub Pages PWA.\n\n## Why\n- The artifact can keep data Claude can read: notes logged on the phone go to its database, and the next session files them into `brain/` as Markdown.\n- It can ask Claude directly (*Ask Claude*) and use dictation – things a static site cannot do without a backend.\n- One codebase: `tools/build-artifact.mjs` turns `brain.html` + the notes into `artifact/second-brain.html`.\n\n## Limits\n- Notes in the artifact are a snapshot: after Claude changes `brain/`, the artifact must be republished.\n- No offline mode or install there; that is what the PWA is for ([[pwa-instead-of-electron]]).\n\n## Workflow\nEach session: read the artifact's `captures` and `edits` collections, file new captures into the right pages, mark them `status: filed`, rebuild and republish. Details in `CLAUDE.md`. Related: [[second-brain-app]]."},{"slug":"pwa-instead-of-electron","path":"brain/Decisions/pwa-instead-of-electron.md","title":"PWA instead of Electron","group":"Decisions","tags":[],"created":1795219200000,"updated":1795219200000,"ideas":[{"title":"Decision","text":"Ship the Second Brain as a Progressive Web App."},{"title":"Why","text":"- Installs from the browser on macOS, Windows, Android and iOS with its own icon and window.\n- Works offline through a service worker.\n- Zero extra tooling; Electron/Tauri would add hundreds of MB and a build pipeline for the same page."},{"title":"Install","text":"Chrome/Edge: install icon in the address bar. Safari (macOS): File → Add to Dock. iPhone: Share → Add to Home Screen."}],"links":[],"tasks":[],"body":"## Decision\nShip the Second Brain as a Progressive Web App.\n\n## Why\n- Installs from the browser on macOS, Windows, Android and iOS with its own icon and window.\n- Works offline through a service worker.\n- Zero extra tooling; Electron/Tauri would add hundreds of MB and a build pipeline for the same page.\n\n## Install\nChrome/Edge: install icon in the address bar. Safari (macOS): File → Add to Dock. iPhone: Share → Add to Home Screen."},{"slug":"static-no-framework","path":"brain/Decisions/static-no-framework.md","title":"Stay static, no framework","group":"Decisions","tags":[],"created":1795219200000,"updated":1795219200000,"ideas":[{"title":"Decision","text":"Keep Zentry as plain static files: HTML + CSS + vanilla JS, one small Node script for the notes."},{"title":"Why","text":"- The repo is already static and deployed by GitHub Pages ([[zentry]]).\n- No dependency installs, nothing to break, opens straight from disk.\n- Canvas 2D with additive blending is fast enough for ~6 000 particles at 60 fps."},{"title":"Revisit when","text":"Accounts, sync between devices or server-side AI are needed – then add a tiny backend, not a framework."}],"links":["zentry"],"tasks":[],"body":"## Decision\nKeep Zentry as plain static files: HTML + CSS + vanilla JS, one small Node script for the notes.\n\n## Why\n- The repo is already static and deployed by GitHub Pages ([[zentry]]).\n- No dependency installs, nothing to break, opens straight from disk.\n- Canvas 2D with additive blending is fast enough for ~6 000 particles at 60 fps.\n\n## Revisit when\nAccounts, sync between devices or server-side AI are needed – then add a tiny backend, not a framework."},{"slug":"ai-summaries","path":"brain/Ideas/ai-summaries.md","title":"AI summaries after every session","group":"Ideas","tags":[],"created":1795219200000,"u 95219200000,"updated":1795219200000,"ideas":[{"title":"Idea","text":"Hold a button on the phone, say what you just did, it lands as a note in Inbox."},{"title":"Status","text":"Done in the phone artifact: the mic button in *Log it* uses claude.ai dictation (Chromium browsers and the desktop app; not the iOS/Android Claude app yet). The note lands in the Inbox and Claude files it. See [[phone-artifact]]."}],"links":["phone-artifact"],"tasks":[],"body":"## Idea\nHold a button on the phone, say what you just did, it lands as a note in Inbox.\n\n## Status\nDone in the phone artifact: the mic button in *Log it* uses claude.ai dictation (Chromium browsers and the desktop app; not the iOS/Android Claude app yet). The note lands in the Inbox and Claude files it. See [[phone-artifact]]."},{"slug":"weekly-review","path":"brain/Ideas/weekly-review.md","title":"Weekly review ritual","group":"Ideas","tags":[],"created":1795219200000,"updated":1795219200000,"ideas":[{"title":"Idea","text":"Fixed slot each week: open Home, read the summaries, close or reschedule tasks in *Coming up*, write one line about what matters next week."},{"title":"Format","text":"A page in Reviews named `YYYY-Www.md`. Links to the Records of that week. See [[ai-summaries]]."}],"links":["ai-summaries"],"tasks":[],"body":"## Idea\nFixed slot each week: open Home, read the summaries, close or reschedule tasks in *Coming up*, write one line about what matters next week.\n\n## Format\nA page in Reviews named `YYYY-Www.md`. Links to the Records of that week. See [[ai-summaries]]."},{"slug":"landing-page","path":"brain/Projects/landing-page.md","title":"Landing page","group":"Projects","tags":["zentry","landing"],"created":1745107200000,"updated":1795219200000,"ideas":[{"title":"What is there","text":"Hero \"Welcome to zentry.\" with the tagline, three feature cards (Fast Performance, Responsive Design, Enhanced Security) and a footer – all generic template text, including \"© 2025 YourBrand\"."},{"title":"Problems","text":"- Nav uses absolute links (`/login.html`) which break under the `/zentry/` GitHub Pages path; the hero button uses `/zentry/login.html`. Mixed and fragile.\n- Copy says nothing about what Zentry actually is.\n- Social icons are emoji placeholders pointing to `#`."},{"title":"Plan","text":"Make the galaxy from [[second-brain-app]] the hero: a live, slowly rotating preview with one line of copy and an \"Open the app\" button. Feature cards become: *Write it down*, *See it all*, *Get the summary*."}],"links":["second-brain-app"],"tasks":[],"body":"## What is there\nHero \"Welcome to zentry.\" with the tagline, three feature cards (Fast Performance, Responsive Design, Enhanced Security) and a footer – all generic template text, including \"© 2025 YourBrand\".\n\n## Problems\n- Nav uses absolute links (`/login.html`) which break under the `/zentry/` GitHub Pages path; the hero button uses `/zentry/login.html`. Mixed and fragile.\n- Copy says nothing about what Zentry actually is.\n- Social icons are emoji placeholders pointing to `#`.\n\n## Plan\nMake the galaxy from [[second-brain-app]] the hero: a live, slowly rotating preview with one line of copy and an \"Open the app\" button. Feature cards become: *Write it down*, *See it all*, *Get the summary*."},{"slug":"second-brain-app","path":"brain/Projects/second-brain-app.md","title":"Second Brain app","group":"Projects","tags":["zentry","second-brain","pwa"],"created":1795219200000,"updated":1795219200000,"ideas":[{"title":"Concept","text":"Everything done in the project gets written down as Markdown notes. Claude writes and rewrites them after each piece of work; the app turns them into a living galaxy you can fly through. Inspired by a \"Second Brain\" desktop demo, but meant to be more useful: positions and brightness carry meaning. See [[galaxy-layout]]."},{"title":"Data model","text":"- **Page** = one `.md` file in `brain/<Group>/`.\n- **Group** = the folder (Projects, Decisions, Ideas, Records, Reference, Reviews).\n- **Idea** = one `##` section inside a page. Every idea is a star.\n- **Link** = a `[[wikilink]]` between pages. Links become constellation lines.\n- **Task** = `- [ ] text @YYYY-MM-DD`. Open tasks with a date show up in *Coming up*.\nFull rules in [[markdown-format]]."},{"title":"Visual","text":"Monochrome galaxy, black hole with an accretion disk at the centre (\"Home\"), dense star dust, smoky nebula, comets on long orbits. Home opens as a dashboard: pages, ideas, links, updates this week, charts, recent activity and the newest conversation summaries."},{"title":"App","text":"Two ways to open it, one codebase (`brain.html`):\n- **Installable PWA** on GitHub Pages – works offline, own icon in the Dock / home screen. See [[pwa-instead-of-electron]].\n- **Phone artifact on claude.ai** – built by `tools/build-artifact.mjs`. There the Inbox syncs to a database Claude can read, *Ask Claude* answers questions from the notes, and dictation works where the browser supports it. See [[phone-artifact]]."},{"title":"Features","text":"- Galaxy: groups as clouds, ideas as stars, links as lines; hovering a star lights up its linked pages.\n- Log it (`N` or the white **+**): quick note with group and deadline; lands in Inbox, Claude files it next session.\n- Time travel (`T`): scrub or replay how the brain grew.\n- Tasks tick off right in the reader; deadlines feed *Coming up*.\n- Home: KPIs, charts, Inbox, recent activity, conversation summaries, search, Ask Claude."},{"title":"Roadmap","text":"- [x] v1 prototype (colourful, capture bar) – rejected, see [[first-prototype-review]]\n- [x] v2: look of the reference video, Markdown as source of truth, PWA\n- [x] v3: capture + Inbox, Ask Claude, time travel, task ticking, phone artifact\n- [ ] AI summaries written automatically after each session @2026-11-30 → [[ai-summaries]]\n- [ ] Open a local folder of notes (Obsidian-style vault) and edit in place @2026-12-03\n- [x] Voice capture from the phone (dictation in the artifact, Chromium only) → [[voice-capture]]"}],"links":["galaxy-layout","markdown-format","pwa-instead-of-electron","phone-artifact","first-prototype-review","ai-summaries","voice-capture"],"tasks":[{"done":true,"text":"v1 prototype (colourful, capture bar) – rejected, see [[first-prototype-review]]","due":null},{"done":true,"text":"v2: look of the reference video, Markdown as source of truth, PWA","due":null},{"done":true,"text":"v3: capture + Inbox, Ask Claude, time travel, task ticking, phone artifact","due":null},{"done":false,"text":"AI summaries written automatically after each session","due":1796061600000},{"done":false,"text":"Open a local folder of notes (Obsidian-style vault) and edit in place","due":1796320800000},{"done":true,"text":"Voice capture from the phone (dictation in the artifact, Chromium only)","due":null}],"body":"## Concept\nEverything done in the project gets written down as Markdown notes. Claude writes and rewrites them after each piece of work; the app turns them into a living galaxy you can fly through. Inspired by a \"Second Brain\" desktop demo, but meant to be more useful: positions and brightness carry meaning. See [[galaxy-layout]].\n\n## Data model\n- **Page** = one `.md` file in `brain/<Group>/`.\n- **Group** = the folder (Projects, Decisions, Ideas, Records, Reference, Reviews).\n- **Idea** = one `##` section inside a page. Every idea is a star.\n- **Link** = a `[[wikilink]]` between pages. Links become constellation lines.\n- **Task** = `- [ ] text @YYYY-MM-DD`. Open tasks with a date show up in *Coming up*.\nFull rules in [[markdown-format]].\n\n## Visual\nMonochrome galaxy, black hole with an accretion disk at the centre (\"Home\"), dense star dust, smoky nebula, comets on long orbits. Home opens as a dashboard: pages, ideas, links, updates this week, charts, recent activity and the newest conversation summaries.\n\n## App\nTwo ways to open it, one codebase (`brain.html`):\n- **Installable PWA** on GitHub Pages – works offline, own icon in the Dock / home screen. See [[pwa-instead-of-electron]].\n- **Phone artifact on claude.ai** – built by `tools/build-artifact.mjs`. There the Inbox syncs to a database Claude can read, *Ask Claude* answers questions from the notes, and dictation works where the browser supports it. See [[phone-artifact]].\n\n## Features\n- Galaxy: groups as clouds, ideas as stars, links as lines; hovering a star lights up its linked pages.\n- Log it (`N` or the white **+**): quick note with group and deadline; lands in Inbox, Claude files it next session.\n- Time travel (`T`): scrub or replay how the brain grew.\n- Tasks tick off right in the reader; deadlines feed *Coming up*.\n- Home: KPIs, charts, Inbox, recent activity, conversation summaries, search, Ask Claude.\n\n## Roadmap\n- [x] v1 prototype (colourful, capture bar) – rejected, see [[first-prototype-review]]\n- [x] v2: look of the reference video, Markdown as source of truth, PWA\n- [x] v3: capture + Inbox, Ask Claude, time travel, task ticking, phone artifact\n- [ ] AI summaries written automatically after each session @2026-11-30 → [[ai-summaries]]\n- [ ] Open a local folder of notes (Obsidian-style vault) and edit in place @2026-12-03\n- [x] Voice capture from the phone (dictation in the artifact, Chromium only) → [[voice-capture]]"},{"slug":"zentry","path":"brain/Projects/zentry.md","title":"Zentry","group":"Projects","tags":["zentry","web"],"created":1745107200000,"updated":1795219200000,"ideas":[{"title":"Goal","text":"\"Your calm workspace in a chaotic world.\" A personal workspace site whose heart is the Second Brain: a place where everything that gets done is written down, summarised and easy to find again."},{"title":"Current state","text":"- `index.html` – landing page (template copy, needs real content) → [[landing-page]]\n- `login.html` / `logindev.html` – client-side password gate (see [[security-login-review]])\n- `main.html` – \"work in progress\" 404-style page\n- `devs.html` – dev status page\n- `brain.html` – the Second Brain app → [[second-brain-app]]"},{"title":"Stack","text":"Plain HTML, CSS and JavaScript. No framework, no build step for the site itself. Notes are Markdown files in `brain/`, compiled to `brain/brain-data.js` by `tools/build-brain.mjs`. See [[static-no-framework]]."},{"title":"Deploy","text":"GitHub Pages via `.github/workflows/static.yml`, triggered by pushes to the `Readme` branch. The site lives under the `/zentry/` sub-path, so links must be relative."},{"title":"Next steps","text":"- [ ] Merge the Second Brain branch into `Readme` so it goes live @2026-11-24\n- [ ] Replace template copy on the landing page @2026-11-28\n- [ ] Decide what the login should really protect @2026-12-05"}],"links":["landing-page","security-login-review","second-brain-app","static-no-framework"],"tasks":[{"done":false,"text":"Merge the Second Brain branch into `Readme` so it goes live","due":1795543200000},{"done":false,"text":"Replace template copy on the landing page","due":1795888800000},{"done":false,"text":"Decide what the login should really protect","due":1796493600000}],"body":"## Goal\n\"Your calm workspace in a chaotic world.\" A personal workspace site whose heart is the Second Brain: a place where everything that gets done is written down, summarised and easy to find again.\n\n## Current state\n- `index.html` – landing page (template copy, needs real content) → [[landing-page]]\n- `login.html` / `logindev.html` – client-side password gate (see [[security-login-review]])\n- `main.html` – \"work in progress\" 404-style page\n- `devs.html` – dev status page\n- `brain.html` – the Second Brain app → [[second-brain-app]]\n\n## Stack\nPlain HTML, CSS and JavaScript. No framework, no build step for the site itself. Notes are Markdown files in `brain/`, compiled to `brain/brain-data.js` by `tools/build-brain.mjs`. See [[static-no-framework]].\n\n## Deploy\nGitHub Pages via `.github/workflows/static.yml`, triggered by pushes to the `Readme` branch. Th   hits.sort((a, b) => b.score - a.score || b.p.updated - a.p.updated);
  const mark = s => { let h = esc(s); words.forEach(w => h = h.replace(new RegExp('(' + esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>')); return h; };
  const snip = t => { const l = t.toLowerCase(), at = l.indexOf(words[0]), k = Math.max(0, at - 40); return (k ? '…' : '') + t.slice(k, k + 140).replace(/\s+/g, ' '); };
  $('#homeBody').innerHTML = `<div class="box res"><div class="eyebrow sm">${hits.length} result${hits.length === 1 ? '' : 's'}</div>${hits.slice(0, 50).map(h => `<div class="li" data-slug="${esc(h.p.slug)}" data-idea="${h.j}"><div class="a">${mark(h.p.title)}${h.p.ideas.length > 1 ? ' <span style="color:var(--dim)">›</span> ' + mark(h.i.title) : ''}</div><div class="s">${esc(h.p.group)} · ${mark(snip(h.i.text))}</div></div>`).join('') || '<div class="empty">Nothing found.</div>'}</div>`;
  bindLinks($('#homeBody'));
}
$('#q').addEventListener('input', e => renderHome(e.target.value));
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { const v = $('#q').value.trim(); const f = $('#homeBody [data-slug]'); if (P.sample && (/\?$/.test(v) || !f)) ask(v); else if (f) f.click(); } });
$('#askBtn').onclick = e => { e.preventDefault(); ask($('#q').value); };

/* ================= ask Claude (artifact only) ================= */
let askCtrl = null;
function refreshAskUI() { $('#askBtn').hidden = !P.sample; $('#q').placeholder = P.sample ? (W < 700 ? 'Search or ask…' : 'Search, or ask your notes a question…') : 'Search every page and conversation…'; if (homeOpen && !$('#q').value.trim()) renderHome(); }
async function ask(q) {
  q = (q || '').trim(); if (!P.sample || !q) return;
  if (askCtrl) askCtrl.abort();
  const ctrl = askCtrl = new AbortController(), out = $('#askOut');
  out.innerHTML = `<div class="answer"><div class="q"><span>${esc(q)}</span><button class="x" id="askX" style="width:22px;height:22px" aria-label="Close answer">✕</button></div><div class="md" id="ansMd"><span class="think">Reading your notes…</span></div></div>`;
  $('#askX').onclick = () => { ctrl.abort(); out.innerHTML = ''; };
  out.parentElement.scrollTop = 0;
  const paint = t => { const el = $('#ansMd'); if (!el || ctrl.signal.aborted) return; el.innerHTML = renderMd(t || '') || '<span class="think">Thinking…</span>'; bindLinks(el); };
  let notes = [...pages].sort((a, b) => b.updated - a.updated).map(p => `### ${p.title} [[${p.slug}]]\n(${p.group} · updated ${iso(p.updated)}${p.capture ? ' · Inbox note, not filed yet' : ''})\n${p.body}`).join('\n\n');
  try { const lim = await P.sample.limits(); if (lim && lim.maxPromptBytes && notes.length > lim.maxPromptBytes * .8) notes = notes.slice(0, Math.floor(lim.maxPromptBytes * .8)); } catch (e) {}
  const prompt = `You are the "Second Brain" of the person reading this: a calm, precise assistant that knows only their notes below (the Zentry project and everything they logged).
Answer the question using these notes only. Reply in the language the question is written in. Keep it short: a few sentences or bullets, Markdown allowed (no headings).
Whenever you rely on a note, cite it inline as [[slug]] exactly as written in that note's header. If the notes do not contain the answer, say so in one line and suggest what to write down.
Today is ${iso(Date.now())}.

<notes>
${notes}
</notes>

Question: ${q}`;
  try { const r = await P.sample(prompt, { onText: ({ text }) => paint(text), signal: ctrl.signal, cache: false }); paint(r.text); }
  catch (e) {
    if (ctrl.signal.aborted) return;
    if (e && e.code === 'not_granted') { P.sample = null; out.innerHTML = ''; refreshAskUI(); return; }
    const el = $('#ansMd'); if (el) el.innerHTML = `<span class="think">${e && e.code === 'rate_limited' ? 'Too many questions in a row. Try again in a minute.' : 'Claude could not answer right now. Try again.'}</span>`;
  }
}

/* ================= capture ================= */
let capGroup = 'Inbox';
function openCapture() {
  closeHome(true);
  const gs = ['Inbox', ...world.groups.map(g => g.name).filter(n => n !== 'Inbox')];
  $('#capGroups').innerHTML = gs.map(n => `<button type="button" data-g="${esc(n)}" class="${n === capGroup ? 'on' : ''}">${esc(n)}</button>`).join('');
  $('#capGroups').querySelectorAll('button').forEach(b => b.onclick = () => { capGroup = b.dataset.g; $('#capWhere').textContent = capGroup; $('#capGroups').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); });
  $('#capWhere').textContent = capGroup;
  $('#capText').value = store.get('draft', '');
  $('#capHint').textContent = P.db ? 'Synced to your Second Brain. Claude files it into the right page next session.' : P.artifact ? 'Saved on this device only (sync is not available in this view).' : 'Saved on this device. Use the Second Brain artifact on your phone to send notes to Claude.';
  $('#capSheet').classList.add('open'); $('#scrim').classList.add('open'); $('#hello').classList.add('hide');
  updateSave(); setTimeout(() => $('#capText').focus(), 60);
}
function closeCapture() {
  if (!$('#capSheet').classList.contains('open')) return;
  $('#capSheet').classList.remove('open'); if (!homeOpen) { $('#scrim').classList.remove('open'); if (!side.classList.contains('open')) $('#hello').classList.remove('hide'); }
  if (P.dict && P.dict.active()) P.dict.stop().catch(() => {});
}
const updateSave = () => { $('#capSave').disabled = !$('#capText').value.trim(); };
$('#capText').addEventListener('input', () => { store.set('draft', $('#capText').value); updateSave(); });
$('#capText').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) saveCapture(); });
$('#capSave').onclick = saveCapture; $('#capClose').onclick = closeCapture; $('#addBtn').onclick = openCapture;
async function saveCapture() {
  const text = $('#capText').value.trim(); if (!text) return;
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text, group: capGroup, due: $('#capDue').value || null, ts: Date.now(), status: 'new', done: false };
  captures = [c, ...captures]; if (!P.db) store.set('captures', captures);
  store.set('draft', ''); $('#capText').value = ''; $('#capDue').value = '';
  closeCapture(); refreshData(); births.set('cap-' + c.id, performance.now());
  toast(P.db ? `Saved to ${capGroup} · Claude will file it` : `Saved to ${capGroup} on this device`);
  if (P.db) try { await P.db.collection('captures').doc(c.id).set(c); } catch (e) { toast('Could not sync that note. Check your connection and log it again.'); }
}
function updateCapture(id, patch) {
  captures = captures.map(c => c.id === id ? { ...c, ...patch } : c);
  if (P.db) P.db.doc('captures/' + id).update(patch).catch(() => toast('Could not sync that change'));
  else store.set('captures', captures);
  refreshData(); const p = bySlug('cap-' + id); if (p && side.classList.contains('open')) openPage(p);
}
function removeCapture(id) {
  captures = captures.filter(c => c.id !== id);
  if (P.db) P.db.doc('captures/' + id).delete().catch(() => toast('Could not remove it from the synced Inbox'));
  else store.set('captures', captures);
  refreshData();
}
function refreshData() {
  const sel = selIdea && { slug: selIdea.page.slug, j: selIdea.j }, fg = focus && focus.name;
  loadPages(); buildWorld(); renderHello();
  selIdea = sel ? world.ideas.find(o => o.page.slug === sel.slug && o.j === sel.j) || null : null;
  focus = fg ? world.groups.find(g => g.name === fg) || null : null;
  if (homeOpen && !$('#q').value.trim()) renderHome();
}

/* ================= time travel ================= */
const ttRange = $('#ttRange');
function setTT(v) {
  const a = Math.min(...pages.map(p => p.created)) - DAY, b = Date.now();
  tt = v >= 1000 ? b + DAY : a + (b - a) * v / 1000;
  $('#ttLbl').textContent = fmtFull(Math.min(tt, b)) + ' · ' + pages.filter(p => p.created <= tt).length + ' pages';
}
let ttAnim = 0;
$('#timeBtn').onclick = () => {
  const open = $('#time').classList.toggle('open'); $('#timeBtn').classList.toggle('on', open);
  cancelAnimationFrame(ttAnim);
  if (open) { ttRange.value = 1000; setTT(1000); } else tt = null;
};
ttRange.oninput = () => { cancelAnimationFrame(ttAnim); setTT(+ttRange.value); };
$('#ttPlay').onclick = () => {
  cancelAnimationFrame(ttAnim); const t0 = performance.now();
  const step = now => { const v = Math.min(1000, (now - t0) / 6000 * 1000); ttRange.value = v; setTT(v); if (v < 1000) ttAnim = requestAnimationFrame(step); };
  ttAnim = requestAnimationFrame(step);
};
document.querySelectorAll('[data-close-home]').forEach(b => b.onclick = () => closeHome());
$('#scrim').onclick = () => { if ($('#capSheet').classList.contains('open')) closeCapture(); else closeHome(); };

/* ================= chrome ================= */
$('#homeBtn').onclick = () => homeOpen ? closeHome() : openHome();
$('#pagesBtn').onclick = () => { closeHome(true); side.classList.contains('open') && !focus && !selIdea ? closeSide() : openPages(); };
$('#zin').onclick = () => cam.tzoom = clampZ(cam.tzoom * 1.35);
$('#zout').onclick = () => cam.tzoom = clampZ(cam.tzoom / 1.35);
$('#zreset').onclick = () => { closeHome(); closeSide(); };
const setPaused = v => { paused = v; $('#pause').innerHTML = v ? '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.5v9l7.5-4.5z"/></svg>' : '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="4.5" y="3.5" width="2.2" height="9" rx=".6"/><rect x="9.3" y="3.5" width="2.2" height="9" rx=".6"/></svg>'; };
setPaused(paused);
$('#pause').onclick = () => setPaused(!paused);
$('#full').onclick = () => { try { const r = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => toast('Fullscreen is not available here')); } catch (e) { toast('Fullscreen is not available here'); } };
if (cfg.title) $('#appTitle').textContent = cfg.title;
addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openHome(); setTimeout(() => $('#q').focus(), reduced ? 0 : 420); return; }
  if (e.key === 'Escape') { if (typing) document.activeElement.blur(); if ($('#capSheet').classList.contains('open')) closeCapture(); else if (homeOpen) closeHome(); else closeSide(); return; }
  if (typing) return;
  if (e.key === ' ') { e.preventDefault(); setPaused(!paused); }
  else if (e.key.toLowerCase() === 'h') homeOpen ? closeHome() : openHome();
  else if (e.key.toLowerCase() === 'p') $('#pagesBtn').click();
  else if (e.key === '0') $('#zreset').click();
  else if (e.key.toLowerCase() === 'n') { e.preventDefault(); openCapture(); }
  else if (e.key.toLowerCase() === 't') $('#timeBtn').click();
  else if (e.key === '+' || e.key === '=') $('#zin').click();
  else if (e.key === '-') $('#zout').click();
});
let tT; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('show'), 2600); }

renderHello();
if (lastVisit) pages.filter(p => p.updated > lastVisit).forEach((p, i) => births.set(p.slug, performance.now() + 600 + i * 250));

/* ================= claude.ai artifact features ================= */
if (P.artifact) {
  const use = n => window.claude.use(n).catch(() => null);
  use('db').then(db => {
    if (!db) return;
    P.db = db;
    const local = store.get('captures', []);                     // send notes made before sync was on
    local.forEach(c => db.collection('captures').doc(c.id).set(c).catch(() => {}));
    if (local.length) store.set('captures', []);
    Object.entries(store.get('overrides', {})).forEach(([slug, raw]) => db.doc('edits/' + slug).set({ raw, ts: Date.now() }).catch(() => {}));
    db.collection('captures').orderBy('ts', 'desc').limit(300).onSnapshot(snap => {
      captures = snap.docs.map(d => ({ ...d.data(), id: d.id })); refreshData();
    }, () => toast('Inbox sync is offline right now'));
    db.collection('edits').onSnapshot(snap => {
      const o = {}; snap.docs.forEach(d => { const r = d.data().raw; if (typeof r === 'string') o[d.id] = r; });
      overrides = o; store.set('overrides', o); refreshData();
    }, () => {});
    renderHello();
  });
  use('sample').then(s => { P.sample = s; refreshAskUI(); });
  use('downloads').then(d => { P.dl = d; });
  use('dictation').then(d => {
    if (!d) return;
    P.dict = d; const mic = $('#micBtn'); mic.hidden = false;
    let baseText = '';
    const join = (a, b) => (a && !/\s$/.test(a) ? a + ' ' : a) + b;
    d.onPartial(({ text }) => { $('#capText').value = join(baseText, text); });
    d.onFinal(({ text }) => { baseText = join(baseText, text); $('#capText').value = baseText; store.set('draft', baseText); updateSave(); });
    d.onState(({ state }) => mic.classList.toggle('live', state === 'listening' || state === 'starting'));
    mic.onclick = () => {
      if (d.active()) { d.stop().catch(() => {}); return; }
      baseText = $('#capText').value;
      d.start().catch(e => { if (e && e.code === 'not_granted') { mic.hidden = true; P.dict = null; } else if (e && e.code !== 'dismissed') toast('Dictation is not available right now'); });
    };
  });
}

/* ================= app (PWA) ================= */
let deferred = null;
const ib = $('#install');
if (ib) {
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; ib.style.display = 'grid'; });
  ib.onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; ib.style.display = 'none'; };
}
if (!P.artifact && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
if (location.hash.length > 1) { const p = bySlug(decodeURIComponent(location.hash.slice(1))); if (p) setTimeout(() => openPage(p), 300); }
})();
</script>
